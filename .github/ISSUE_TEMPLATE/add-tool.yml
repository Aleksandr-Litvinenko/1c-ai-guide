name: Предложить инструмент
description: Добавить open-source проект в проверяемый каталог AI × 1C
title: "[Tool]: "
labels: [catalog]
body:
  - type: input
    id: repository
    attributes:
      label: Репозиторий
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Проверенная версия
      description: Полный commit SHA или релиз, на котором основано описание.
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Какую задачу решает
      description: Одно проверяемое описание без рекламных формулировок.
    validations:
      required: true
  - type: dropdown
    id: data-access
    attributes:
      label: Доступ к бизнес-данным
      options:
        - Не требуется
        - Только чтение
        - Чтение и запись
        - Настраивается
        - Неизвестно
    validations:
      required: true
  - type: textarea
    id: mutation
    attributes:
      label: Операции записи и удаления
      description: Перечислите write/delete tools, выполнение произвольного кода и режим по умолчанию. Если их нет — объясните, чем запрет обеспечен на сервере.
    validations:
      required: true
  - type: textarea
    id: prerequisites
    attributes:
      label: Требования и платформы
      description: ОС, версии 1С/EDT, runtime, Docker, внешние компоненты и ограничения.
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: Лицензия
      placeholder: MIT, Apache-2.0 или не объявлена
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Как проверить
      description: Точные команды, ожидаемый результат и ссылки на README, релиз или логи безопасного smoke-test.
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Подтверждение
      options:
        - label: Я не публикую пароли, токены или реальные бизнес-данные.
          required: true
        - label: Я отделил проверенные факты от предположений и указал непроверенные этапы.
          required: true
